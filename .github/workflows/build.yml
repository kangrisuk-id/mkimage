name: Build and Package mkimage (CMake & CPack)

on:
  workflow_dispatch:

jobs:
  build-and-package:
    name: Build & Package (${{ matrix.target.name }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        target:
          - name: Linux-x86_64
            toolchain_flags: ""
            artifact_name: mkimage-linux-archive
          - name: Windows-x86_64
            toolchain_flags: "-DCMAKE_SYSTEM_NAME=Windows -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc"
            artifact_name: mkimage-windows-archive

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies & toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            gcc \
            g++ \
            mingw-w64 \
            zlib1g-dev

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            ${{ matrix.target.toolchain_flags }}

      - name: Build Project
        run: |
          cmake --build build --config Release

      - name: Package with CPack
        run: |
          cd build
          cpack -C Release

      - name: Prepare Artifacts for Upload
        run: |
          mkdir -p dist
          find build -maxdepth 1 \( -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} dist/ \;
          
          if [ -z "$(ls -A dist)" ]; then
            echo "Error: CPack failed to generate package archives!"
            exit 1
          fi
          echo "*Verification:* CPack successfully generated archives:"
          ls -la dist/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.artifact_name }}
          path: dist/*
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build-and-package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04

    steps:
      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets

      - name: Flatten directory & generate SHA256SUMS
        run: |
          mkdir -p final_release
          find release_assets -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} final_release/ \;
          
          cd final_release
          sha256sum * > SHA256SUMS
          
          echo "Generated SHA256SUMS content:"
          cat SHA256SUMS

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: final_release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
